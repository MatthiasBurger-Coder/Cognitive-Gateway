services:
  runtime:
    # The CPU/NVIDIA reference version predates packaged Vulkan support.
    # Choose an explicit Vulkan-capable image and qualify its runtime version.
    image: ${CG_MODEL_VULKAN_IMAGE:?Set CG_MODEL_VULKAN_IMAGE to an explicitly versioned Vulkan-capable Ollama image}
    environment:
      OLLAMA_VULKAN: "1"
      GGML_VK_VISIBLE_DEVICES: ${CG_VULKAN_VISIBLE_DEVICES:-0}
    devices:
      - /dev/dri:/dev/dri
  model-service:
    environment:
      CG_MODEL_ACCELERATION: vulkan
