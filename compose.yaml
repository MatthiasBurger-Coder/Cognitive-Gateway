name: ${CG_COMPOSE_PROJECT_NAME:-cognitive-gateway}

services:
  postgres:
    image: ${CG_POSTGRES_IMAGE:-postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_DB: cognitive_gateway
      POSTGRES_USER: cognitive_gateway
      POSTGRES_PASSWORD: ${CG_POSTGRES_PASSWORD:?Set CG_POSTGRES_PASSWORD in the credential file}
    ports:
      - "127.0.0.1:${CG_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
