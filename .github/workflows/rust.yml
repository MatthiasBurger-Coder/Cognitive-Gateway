name: Rust Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Declarative v0.1 quality gate
        run: python3 scripts/quality-gate.py --output target/ci-release-evidence
      - name: Retain release evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: declarative-v0.1-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci-release-evidence
          if-no-files-found: error
          retention-days: 30
