name: Rust Quality

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality_shards:
    name: quality (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [foundation, application, models, connectors]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cognitive_gateway
          POSTGRES_USER: cognitive_gateway
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U cognitive_gateway -d cognitive_gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      # Match the toolchain used for qualified coverage evidence. Upgrade Rust
      # and cargo-llvm-cov together with a fresh run of the full quality gate.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy, llvm-tools-preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract validation and gate regression dependencies
        run: python3 -m pip install -r tests/contracts/requirements.txt coverage==7.15.2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Configure PostgreSQL integration test
        run: |
          printf 'CG_POSTGRES_PASSWORD=ci-local-only\nCG_POSTGRES_PORT=55432\n' > "$RUNNER_TEMP/postgres.env"
          chmod 600 "$RUNNER_TEMP/postgres.env"
          echo "CG_POSTGRES_ENV_FILE=$RUNNER_TEMP/postgres.env" >> "$GITHUB_ENV"
      - name: Declarative v0.1 quality gate
        run: python3 tests/scripts/quality-gate.py --shard "${{ matrix.shard }}" --output target/ci-release-evidence
      - name: Retain release evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-shard-${{ matrix.shard }}
          overwrite: true
          path: target/ci-release-evidence
          if-no-files-found: error
          retention-days: 30

  quality:
    needs: quality_shards
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all four jobs to pass
        env:
          RESULT: ${{ needs.quality_shards.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: quality-shard-*
          path: target/quality-shards
      - name: Verify and combine full quality evidence
        run: >-
          python3 tests/scripts/quality-gate.py
          --collect target/quality-shards --output target/ci-release-evidence
      - name: Retain complete release evidence
        uses: actions/upload-artifact@v4
        with:
          name: declarative-v0.1-${{ github.sha }}-${{ github.run_attempt }}
          path: target/ci-release-evidence
          if-no-files-found: error
          retention-days: 30
